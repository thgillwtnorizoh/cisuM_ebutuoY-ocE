name: test uploader root fix

on:
  push:
    branches:
      - fix-uploader-root-cause-043
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Build candidate EAPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug
          SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "fartnite-root-fix-v${SHA}.eapk"
      - name: Upload candidate EAPK
        uses: actions/upload-artifact@v4
        with:
          name: fartnite-root-fix-${{ github.sha }}
          path: fartnite-root-fix-v*.eapk
          if-no-files-found: error
