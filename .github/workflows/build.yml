name: test direct queue cache

on:
  push:
    branches:
      - fix-direct-queue-cache-043

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Verify candidate baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ytmkt = "0.4.3"' gradle/libs.versions.toml
          git merge-base --is-ancestor 37698b0bebba2f845f5f7b6377bed3c5df2dc3cd HEAD
          git diff --check 6bfd7ab7bc0f6cea361f974531dfcde424f10b15..HEAD -- ext/src/main/java/dev/brahmkshatriya/echo/extension/providers/playback/TrackLoader.kt

      - name: Build candidate EAPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk fartnite-direct-queue-cache-candidate.eapk

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: fartnite-direct-queue-cache-candidate
          path: fartnite-direct-queue-cache-candidate.eapk
          if-no-files-found: error
