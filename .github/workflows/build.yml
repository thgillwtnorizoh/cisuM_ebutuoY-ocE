name: inspect ytm-kt 0.6.1

on:
  push:
    branches:
      - inspect-ytmkt-061

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout radio-fixed base
        uses: actions/checkout@v4

      - name: Resolve and collect ytm-kt 0.6.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/downloads inspection/extracted

          curl -fsSL 'https://search.maven.org/solrsearch/select?q=v:%220.6.1%22%20AND%20(g:%22dev.toastbits.ytmkt%22%20OR%20g:%22dev.toastbits%22)&rows=100&wt=json' \
            -o inspection/search.json

          jq -r '.response.docs[] | [.g,.a,.v,.p] | @tsv' inspection/search.json \
            | tee inspection/artifacts.tsv

          while IFS=$'\t' read -r group artifact version packaging; do
            [ -n "$group" ] || continue
            base="https://repo.maven.apache.org/maven2/${group//./\/}/$artifact/$version"
            prefix="inspection/downloads/$artifact-$version"

            curl -fsSL "$base/$artifact-$version.pom" -o "$prefix.pom" || true
            curl -fsSL "$base/$artifact-$version.module" -o "$prefix.module" || true
            curl -fsSL "$base/$artifact-$version-sources.jar" -o "$prefix-sources.jar" || true
          done < inspection/artifacts.tsv

          for jar in inspection/downloads/*-sources.jar; do
            [ -f "$jar" ] || continue
            name=$(basename "$jar" .jar)
            mkdir -p "inspection/extracted/$name"
            unzip -q "$jar" -d "inspection/extracted/$name"
          done

          find inspection/extracted -type f | sort > inspection/source-files.txt

          grep -RniE \
            'YTMLoadSongEndpoint|YTMGetSongFeedEndpoint|YoutubeiApi|YoutubeiAuthenticationState|videoDetails|author|channelId|addApiHeadersWithAuthenticated|SAPISID|cookie|SongFeed|RadioBuilder|RadioEndpoint|isAudioOnly' \
            inspection/extracted > inspection/relevant-grep.txt || true

          {
            echo '=== exact high-value source files ==='
            find inspection/extracted -type f \
              \( -name 'YTMLoadSongEndpoint.kt' \
              -o -name 'YTMGetSongFeedEndpoint.kt' \
              -o -name 'YoutubeiApi.kt' \
              -o -name 'YoutubeiAuthenticationState.kt' \
              -o -name 'YtmArtist.kt' \
              -o -name 'YtmSong.kt' \
              -o -name '*Radio*Endpoint.kt' \
              -o -name '*Radio*.kt' \) -print | sort
          } > inspection/high-value-files.txt

          cat inspection/artifacts.tsv
          cat inspection/high-value-files.txt

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: ytm-kt-0.6.1-inspection
          path: inspection
          if-no-files-found: error
