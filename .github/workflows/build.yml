name: inspect ytm-kt 0.6.1

on:
  push:
    branches:
      - inspect-ytmkt-061

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout radio-fixed base
        uses: actions/checkout@v4

      - name: Compare v0.6.1 with legacy lines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          REMOTE='https://gitlab.com/syk.sh/ytm-kt.git'

          git clone -q "$REMOTE" inspection/upstream
          cd inspection/upstream

          git rev-parse v0.6.1 > ../v061-commit.txt
          git rev-parse origin/legacy > ../legacy-commit.txt
          git rev-parse origin/spmp > ../spmp-commit.txt

          for ref in v0.6.1 origin/legacy origin/spmp; do
            safe=$(echo "$ref" | tr '/.' '__')
            mkdir -p "../refs/$safe"
            git archive "$ref" | tar -x -C "../refs/$safe"

            {
              echo "=== $ref ==="
              git log -1 --format=fuller "$ref"
              echo
              echo '--- version hints ---'
              git grep -n -E '0\.[0-9]+\.[0-9]+(-legacy)?|project-version-name|versionName' "$ref" -- \
                'gradle/**' '*.gradle.kts' '*.properties' 'README.md' 2>/dev/null | head -120 || true
            } > "../$safe-info.txt"
          done

          git diff --stat origin/legacy..v0.6.1 > ../legacy-to-v061-stat.txt
          git diff --stat origin/spmp..v0.6.1 > ../spmp-to-v061-stat.txt

          for base in origin/legacy origin/spmp; do
            safe=$(echo "$base" | tr '/.' '__')
            git diff "$base..v0.6.1" -- \
              'library/src/**/YTMLoadSongEndpoint.kt' \
              'library/src/**/parseSongResponse.kt' \
              'library/src/**/YTMGetSongFeedEndpoint.kt' \
              'library/src/**/YoutubeiApi.kt' \
              'library/src/**/YoutubeiAuthenticationState.kt' \
              'library/src/**/YoutubeiRequestData.kt' \
              'library/src/**/*Radio*.kt' \
              'library/src/**/YtmArtist.kt' \
              'library/src/**/YtmSong.kt' \
              > "../$safe-to-v061-focused.patch" || true
          done

          cd ..
          rm -rf upstream

          echo '=== v0.6.1 ==='
          cat v0_6_1-info.txt
          echo '=== legacy ==='
          cat origin_legacy-info.txt
          echo '=== spmp ==='
          cat origin_spmp-info.txt

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: ytm-kt-0.6.1-legacy-comparison
          path: inspection
          if-no-files-found: error
