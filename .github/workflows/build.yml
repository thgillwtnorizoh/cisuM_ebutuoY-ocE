name: test queue hydration

on:
  push:
    branches:
      - fix-queue-hydration-043-clean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Verify candidate baseline
        shell: bash
        run: |
          grep -q 'ytmkt = "0.4.3"' gradle/libs.versions.toml
          git merge-base --is-ancestor 37698b0bebba2f845f5f7b6377bed3c5df2dc3cd HEAD
          git diff --check 37698b0bebba2f845f5f7b6377bed3c5df2dc3cd..HEAD -- ext/src/main/java/dev/brahmkshatriya/echo/extension/providers/playback/TrackLoader.kt ext/src/main/java/dev/brahmkshatriya/echo/extension/providers/playback/RadioGenerator.kt ext/src/main/java/dev/brahmkshatriya/echo/extension/providers/ExtensionComponents.kt

      - name: Build candidate EAPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug
          version="v$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "fartnite-queue-hydration-${version}.eapk"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: fartnite-queue-hydration-candidate
          path: fartnite-queue-hydration-*.eapk
          if-no-files-found: error
