name: test queue uploader fix

"on":
  push:
    branches:
      - fix-queue-unknown-uploader-043

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Verify frozen dependency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ytmkt = "0.4.3"' gradle/libs.versions.toml
          git diff --check 37698b0bebba2f845f5f7b6377bed3c5df2dc3cd..HEAD

      - name: Build candidate EAPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk fartnite-queue-uploader-043-candidate.eapk

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: fartnite-queue-uploader-043-candidate
          path: fartnite-queue-uploader-043-candidate.eapk
          if-no-files-found: error
