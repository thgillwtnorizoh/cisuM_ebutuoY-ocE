name: inspect ytm-kt 0.6.1

on:
  push:
    branches:
      - inspect-ytmkt-061

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout radio-fixed base
        uses: actions/checkout@v4

      - name: Collect ytm-kt 0.6.1 GitLab source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection

          REMOTE='https://gitlab.com/syk.sh/ytm-kt.git'
          git ls-remote --heads --tags "$REMOTE" > inspection/remote-refs.txt

          git clone -q "$REMOTE" inspection/repo
          cd inspection/repo

          git tag --sort=-version:refname > ../tags.txt
          git branch -a > ../branches.txt

          if git rev-parse -q --verify 'refs/tags/0.6.1' >/dev/null; then
            TARGET='0.6.1'
          elif git rev-parse -q --verify 'refs/tags/v0.6.1' >/dev/null; then
            TARGET='v0.6.1'
          else
            echo 'No 0.6.1 tag found' >&2
            cat ../tags.txt >&2
            exit 2
          fi

          git checkout -q --detach "$TARGET"
          git rev-parse HEAD > ../target-commit.txt
          git log -1 --format=fuller > ../target-commit-details.txt
          git log --oneline --decorate -30 > ../recent-log.txt
          find . -type f -not -path './.git/*' | sort > ../source-files.txt

          BASE=''
          for candidate in 0.5.0-legacy v0.5.0-legacy 0.5.0 v0.5.0; do
            if git rev-parse -q --verify "refs/tags/$candidate" >/dev/null; then
              BASE="$candidate"
              break
            fi
          done
          printf '%s\n' "$BASE" > ../comparison-base.txt

          if [ -n "$BASE" ]; then
            git log --oneline --decorate "$BASE..$TARGET" > ../changes-since-0.5.txt
            git diff --stat "$BASE..$TARGET" > ../diff-stat-since-0.5.txt
            git diff "$BASE..$TARGET" -- \
              'library/src/**/YTMLoadSongEndpoint.kt' \
              'library/src/**/YTMGetSongFeedEndpoint.kt' \
              'library/src/**/YoutubeiApi.kt' \
              'library/src/**/YoutubeiAuthenticationState.kt' \
              'library/src/**/*Radio*.kt' \
              'library/src/**/YtmArtist.kt' \
              'library/src/**/YtmSong.kt' \
              > ../focused-diff-since-0.5.patch || true
          fi

          mkdir -p ../high-value
          find . -type f \
            \( -name 'YTMLoadSongEndpoint.kt' \
            -o -name 'YTMGetSongFeedEndpoint.kt' \
            -o -name 'YoutubeiApi.kt' \
            -o -name 'YoutubeiAuthenticationState.kt' \
            -o -name 'YtmArtist.kt' \
            -o -name 'YtmSong.kt' \
            -o -name '*Radio*Endpoint.kt' \
            -o -name '*Radio*.kt' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradle.properties' \
            -o -name 'README.md' \) \
            -not -path './.git/*' -print0 \
            | while IFS= read -r -d '' f; do
                dest="../high-value/${f#./}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done

          grep -RniE \
            'videoDetails|author|channelId|addApiHeadersWithAuthenticated|SAPISID|cookie|authentication|SongFeed|RadioBuilder|RadioEndpoint|isAudioOnly|visitorData|accountName' \
            . --exclude-dir=.git > ../relevant-grep.txt || true

          cd ..
          rm -rf repo/.git
          tar -czf ytm-kt-0.6.1-source.tar.gz repo

          echo '=== tag ==='
          cat target-commit.txt
          echo '=== available tags ==='
          cat tags.txt
          echo '=== comparison base ==='
          cat comparison-base.txt
          echo '=== changes ==='
          cat changes-since-0.5.txt 2>/dev/null || true

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: ytm-kt-0.6.1-gitlab-source
          path: inspection
          if-no-files-found: error
