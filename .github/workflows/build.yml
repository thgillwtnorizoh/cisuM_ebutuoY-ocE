name: diagnose queue metadata source

"on":
  push:
    branches:
      - diag-queue-source-043

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Verify frozen dependency
        shell: bash
        run: |
          grep -q 'ytmkt = "0.4.3"' gradle/libs.versions.toml

      - name: Inject diagnostic source markers
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/diag_patch.py
          python3 /tmp/diag_patch.py
          git diff --check -- ext/src/main/java/dev/brahmkshatriya/echo/extension/Convertors.kt ext/src/main/java/dev/brahmkshatriya/echo/extension/providers/playback/RadioGenerator.kt

      - name: Build diagnostic EAPK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk fartnite-queue-source-diagnostic.eapk

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: fartnite-queue-source-diagnostic
          path: fartnite-queue-source-diagnostic.eapk
          if-no-files-found: error
