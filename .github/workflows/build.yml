name: build fartnite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Cook build variables
        shell: bash
        run: |
          name=$(grep '^extName=' gradle.properties | cut -d'=' -f2-)
          id=$(grep '^extId=' gradle.properties | cut -d'=' -f2-)
          version="v$(git rev-parse --short=7 HEAD)"
          message=$(git log -1 --pretty=%B)

          echo "NAME=$name Extension" >> "$GITHUB_ENV"
          echo "TAG=$id" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_PATH=app/build/${id}-${version}.eapk" >> "$GITHUB_ENV"

          printf '## %s Extension\n%s\n' "$name" "$message" > commit.txt
          chmod +x ./gradlew

      - name: Build debug EAPK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "${{ env.APP_PATH }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-${{ env.VERSION }}
          path: ${{ env.APP_PATH }}
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ env.VERSION }}
          body_path: commit.txt
          name: ${{ env.VERSION }}
          files: ${{ env.APP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
